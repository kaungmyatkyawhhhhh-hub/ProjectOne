<html><head><style>
@font-face{font-family:M;font-weight:800;font-style:italic;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-italic.woff2)}
@font-face{font-family:M;font-weight:700;font-style:italic;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-italic.woff2)}

*{box-sizing:border-box}
body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:M;font-style:italic;font-weight:800;color:#fff;background:#1b1622;position:relative}

@keyframes sweep{0%{left:-50%}40%,100%{left:120%}}
.shine{position:absolute;top:-10%;bottom:-10%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-15deg);animation:sweep 2.4s ease-in-out infinite}
@keyframes spark{0%,100%{opacity:0;transform:scale(.2) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}70%{opacity:0;transform:scale(.6) rotate(90deg)}}
.sp{position:absolute;width:12px;height:12px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:spark 1.6s ease-in-out infinite;pointer-events:none}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1)}}
.mote{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff6c0;box-shadow:0 0 4px #ffd25a;animation:rise 1.8s ease-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 2px #08060c,0 0 22px 2px rgba(255,100,20,.75),0 0 60px 8px rgba(255,90,20,.28)}50%{box-shadow:0 0 0 2px #08060c,0 0 34px 6px rgba(255,120,30,1),0 0 90px 16px rgba(255,90,20,.5)}}
@keyframes iglow{0%,100%{filter:drop-shadow(0 0 4px var(--c)) drop-shadow(0 3px 0 rgba(0,0,0,.6))}50%{filter:drop-shadow(0 0 14px var(--c)) drop-shadow(0 3px 0 rgba(0,0,0,.6))}}
@keyframes ember{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(30px,-46px)}}
.ember{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd08a;box-shadow:0 0 5px #ff8a2a;animation:ember 3s linear infinite}
@keyframes ring{0%,100%{outline-color:rgba(255,255,255,1)}50%{outline-color:rgba(255,255,255,.35)}}
