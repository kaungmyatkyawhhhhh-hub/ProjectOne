<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Lucky;src:url(node_modules/@fontsource/luckiest-guy/files/luckiest-guy-latin-400-normal.woff2)}
@font-face{font-family:Nunito;font-weight:800;src:url(node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2)}
@font-face{font-family:Nunito;font-weight:900;src:url(node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2)}
:root{
 --ink:#140F2E; --panelA:#232861; --panelB:#161940; --gold:#D9AE52; --goldHi:#F7D98A; --goldLo:#8C5E1E;
 --cream:#F6EEDA; --cyan:#8FE6FF; --violet:#A58BFF; --red:#FF4F63; --green:#56D687; --greenLo:#1E7A47;
}
*{box-sizing:border-box;margin:0}
body{background:#000;font-family:Nunito,sans-serif;color:var(--cream)}
.board{position:relative;width:1280px;height:720px;overflow:hidden;margin-bottom:20px}
/* scene */
.sky{position:absolute;inset:0;background:
 radial-gradient(ellipse 520px 260px at 300px 170px, rgba(176,90,200,.35), transparent 70%),
 radial-gradient(ellipse 600px 300px at 1000px 120px, rgba(70,90,220,.35), transparent 70%),
 linear-gradient(#0A0A22,#1B1240 55%,#2B1B4E)}
.ground{position:absolute;left:-200px;right:-200px;top:420px;height:600px;border-radius:50%;
 background:radial-gradient(ellipse at 50% 18%,#D9C8A6,#A89071 45%,#6F5B47 75%)}
.chart{position:absolute;left:390px;top:440px;width:500px;height:140px;border-radius:50%;border:2px solid rgba(140,94,30,.55)}
.chart.b{left:470px;top:462px;width:340px;height:96px}
.label-zone{position:absolute;border:1.5px dashed rgba(255,255,255,.28);border-radius:10px;color:rgba(255,255,255,.4);font:800 11px Nunito;display:flex;align-items:center;justify-content:center;text-align:center}
/* panel style: ink-blue + thin gold chart line + corner stars */
.panel{position:absolute;background:linear-gradient(var(--panelA),var(--panelB));border:3px solid var(--ink);border-radius:14px;
 box-shadow:inset 0 0 0 1.5px rgba(217,174,82,.85), inset 0 2px 0 3px rgba(255,255,255,.06), 0 5px 0 var(--ink)}
.cs{position:absolute;width:9px;height:9px;background:var(--goldHi);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.num{font-family:Lucky;letter-spacing:.5px;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.btn{position:absolute;border:3px solid var(--ink);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:linear-gradient(#2B3170,#1A1D48);box-shadow:inset 0 0 0 1.5px rgba(217,174,82,.9), 0 5px 0 var(--ink)}
.btn .t{font-family:Lucky;font-size:13px;letter-spacing:.5px;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;margin-top:-2px}
.dot{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--red);border:2.5px solid #fff;font:900 12px Nunito;color:#fff;display:flex;align-items:center;justify-content:center}
.brass{background:linear-gradient(var(--goldHi),var(--gold) 55%,#C08F3A);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 5px 0 var(--goldLo),0 5px 0 3px var(--ink);border:3px solid var(--ink)}
.green{background:linear-gradient(#8AF0AE,var(--green) 55%,#36B56A);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 var(--greenLo);border:3px solid var(--ink)}
.cap{position:absolute;font:800 12px Nunito;color:rgba(255,255,255,.55)}

<script>
const rows=[
 {n:"ASTEROID",c:"#9CA3B8",own:48,inc:"+96/s",next:"48/50",x:"x2",cost:"1.2K"},
 {n:"MOON",c:"#D9D3C2",own:31,inc:"+620/s",next:"31/50",x:"x2",cost:"8.4K"},
 {n:"PLANET",c:"#8E6BFF",own:22,inc:"+2.2K/s",next:"22/25",x:"x2",cost:"41K"},
 {n:"GAS GIANT",c:"#FF9D4D",own:9,inc:"+560/s",next:"9/25",x:"x2",cost:"210K",dim:true},
 {n:"STAR",c:"#FFD36B",own:2,inc:"+1.4K/s",next:"2/25",x:"x2",cost:"1.1M",dim:true},
 {n:"? ? ?",lock:"SUPERNOVA 3"},
];
const box=document.getElementById('rows');
rows.forEach((r,i)=>{
 const d=document.createElement('div');
 d.style.cssText=`position:relative;height:66px;margin-bottom:10px;border-radius:14px;border:2px solid rgba(20,15,46,.9);background:${r.lock?'rgba(10,10,30,.45)':'rgba(255,255,255,.05)'};box-shadow:inset 0 0 0 1px rgba(217,174,82,${r.lock?.25:.45})`;
 if(r.lock){
  d.innerHTML=`<svg style="position:absolute;left:12px;top:9px" width="46" height="46"><circle cx="23" cy="23" r="17" fill="#2A2C55" stroke="#140F2E" stroke-width="3.5"/><text x="23" y="30" text-anchor="middle" font-family="Lucky" font-size="20" fill="#7D80B5">?</text></svg>
  <div class="num" style="position:absolute;left:70px;top:20px;font-size:22px;color:#7D80B5">${r.n}</div>
  <div style="position:absolute;right:18px;top:22px;font:900 14px Nunito;color:#9C9FD1">UNLOCKS AT ${r.lock}</div>`;
 } else {
  const pct=parseInt(r.next)/parseInt(r.next.split('/')[1])*100;
  d.innerHTML=`<svg style="position:absolute;left:12px;top:9px" width="46" height="46"><circle cx="23" cy="23" r="17" fill="${r.c}" stroke="#140F2E" stroke-width="3.5"/><path d="M23 6 A17 17 0 0 1 40 23 L33 23 A10 10 0 0 0 23 13Z" fill="#fff" opacity=".45"/><circle cx="23" cy="23" r="17" fill="none" stroke="#140F2E" stroke-width="3.5"/></svg>
  <div class="num" style="position:absolute;left:70px;top:9px;font-size:22px;color:#fff">${r.n}</div>
  <div style="position:absolute;left:70px;top:38px;font:900 13px Nunito;color:var(--cyan)">${r.inc}</div>
  <div class="num" style="position:absolute;left:262px;top:18px;font-size:22px;color:var(--goldHi)">x${r.own}</div>
  <div style="position:absolute;left:340px;top:16px;width:150px;height:14px;border-radius:7px;background:#0F1030;border:2px solid #140F2E"><div style="width:${pct}%;height:100%;border-radius:6px;background:linear-gradient(#FFE6A0,#E8B24E)"></div></div>
  <div style="position:absolute;left:340px;top:36px;font:800 12px Nunito;opacity:.75">${r.next} &rarr; ${r.x} income</div>
  <div class="${r.dim?'':'green'}" style="position:absolute;right:12px;top:10px;width:150px;height:44px;border-radius:13px;${r.dim?'background:#3A3D63;border:3px solid #140F2E;':''}display:flex;align-items:center;justify-content:center;gap:6px">
   <svg width="22" height="22"><use href="#i-dust"/></svg><span class="num" style="font-size:20px;color:${r.dim?'#9C9FD1':'#fff'};margin-top:3px">${r.cost}</span></div>`;
 }
 box.appendChild(d);
});
</script>
