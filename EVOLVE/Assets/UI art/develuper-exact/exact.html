<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#fff;overflow:hidden} svg text{font-family:'Fredoka One'}</style>
<script src="params.js"></script>
</head><body>
<script>
// Develuper RETRY button, measured from his Figma frame (video t=266s, zoom 1.409, origin = face top-left).
const P = window.P;
const INK = '#000';
const W = 509, H = 147, R = P.r, LIP = P.lip, FH = H - LIP;

const stops = P.stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('');
function label(t, x, y, size, sw, depth, ls) {
  const a = `x="${x}" font-size="${size}" letter-spacing="${ls}" stroke-linejoin="round" paint-order="stroke"`;
  return `<text ${a} y="${y + depth}" fill="${INK}" stroke="${INK}" stroke-width="${sw}">${t}</text>
          <text ${a} y="${y}" fill="#fff" stroke="${INK}" stroke-width="${sw}">${t}</text>`;
}
function icon(cx, cy, Rr, w, sw, depth) {
  const t0 = P.icon.a0 * Math.PI / 180, t1 = P.icon.a1 * Math.PI / 180;
  const pt = t => [cx + Rr * Math.cos(t), cy + Rr * Math.sin(t)];
  const [x0, y0] = pt(t0), [x1, y1] = pt(t1);
  const d = `M ${x0} ${y0} A ${Rr} ${Rr} 0 1 1 ${x1} ${y1}`;
  // arrowhead at the top end, pointing along the clockwise tangent
  const hr = t1 + (P.icon.rot || 0) * Math.PI / 180;   // head can turn off the tangent, as his does
  const dx = -Math.sin(hr), dy = Math.cos(hr), nx = Math.cos(hr), ny = Math.sin(hr);
  const h = P.icon.head, b = P.icon.base;
  const tip = [x1 + dx * h, y1 + dy * h];
  const head = `${tip} ${x1 + nx * b},${y1 + ny * b} ${x1 - nx * b},${y1 - ny * b}`;
  const g = (off, col, ww, hw) => `<g transform="translate(0,${off})"><path d="${d}" fill="none" stroke="${col}" stroke-width="${ww}" stroke-linecap="round"/>
     <polygon points="${head}" fill="${col}" stroke="${col}" stroke-width="${hw}" stroke-linejoin="round"/>
     <circle cx="${x1}" cy="${y1}" r="${ww / 2}" fill="${col}"/></g>`;
  return g(depth, INK, w + sw, sw) + g(0, INK, w + sw, sw) + g(0, '#fff', w, 0.01);
}
const stripes = P.stripes.map(([x, wd]) =>
  `<polygon points="${x},-5 ${x + wd},-5 ${x + wd - FH * P.slant},${FH + 5} ${x - FH * P.slant},${FH + 5}"/>`).join('');

const body = `
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">${stops}</linearGradient>
  <clipPath id="c"><rect width="${W}" height="${FH}" rx="${R}"/></clipPath>
  <pattern id="d" width="${P.dot.grid}" height="${P.dot.grid}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect x="${(P.dot.grid - P.dot.size) / 2}" y="${(P.dot.grid - P.dot.size) / 2}" width="${P.dot.size}" height="${P.dot.size}" fill="${P.dot.color}"/></pattern>
  <linearGradient id="f" x1="0" y1="0" x2="0" y2="1">
    <stop offset="${P.dot.from}" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
  <mask id="m"><rect width="${W}" height="${FH}" fill="url(#f)"/></mask>
  <filter id="drop" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/></filter>
</defs>
<g filter="url(#drop)">
  <rect width="${W}" height="${H}" rx="${R}" fill="none" stroke="${INK}" stroke-width="${P.outline * 2}"/>
  <rect width="${W}" height="${H}" rx="${R}" fill="${P.lipColor}"/>
</g>
<g clip-path="url(#c)">
  <rect width="${W}" height="${FH}" fill="url(#g)"/>
  <rect width="${W}" height="${FH}" fill="url(#d)" mask="url(#m)" opacity="${P.dot.opacity}"/>
  <g fill="${P.stripeColor}" opacity="${P.stripeOpacity}" style="mix-blend-mode:${P.stripeBlend || 'normal'}">${stripes}</g>
  <rect y="${FH - P.line.h}" width="${W}" height="${P.line.h}" fill="${P.line.color}"/>
  <rect x="${P.edge.w / 2}" y="${P.edge.w / 2}" width="${W - P.edge.w}" height="${FH - P.edge.w}" rx="${R - P.edge.w / 2}" fill="none"
        stroke="${P.edge.color}" stroke-width="${P.edge.w}" opacity="${P.edge.opacity}"/>
</g>
${label('RETRY', P.text.x, P.text.y, P.text.size, P.text.sw, P.text.depth, P.text.ls)}
${icon(P.icon.cx, P.icon.cy, P.icon.r, P.icon.w, P.icon.sw, P.icon.depth)}`;

document.body.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
  <g transform="translate(${P.X0},${P.Y0}) scale(${P.Z})">${body}</g></svg>`;
</script></body></html>
